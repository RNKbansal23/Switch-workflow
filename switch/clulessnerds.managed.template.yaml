# Portable adaptation of the managed template used in the completed live run.
# Select your own directory, messaging connection, and machine. Codex sign-in required.
version: 1
params:
  directory:
    type: directory
    description: Existing absolute ProofDesk project directory on the selected machine
    required: true
  bridge:
    type: bridge
    required: true
    description: Choose your connected messaging app
    default:
    - $first
  machine:
    type: machine
    default:
    - $first
    description: Select this computer, whose controller reports Codex signed in
agents:
- name: clulessnerds-concierge
  description: Clarifies reports and drafts evidence-backed replies
  provider: codex
  directory: '{directory}'
  addressing: owner-agents
  auto_mode: true
  auto_approve: false
  instructions: 'Read agents/concierge.md and follow it as your workflow contract.

    Your Builder is @clulessnerds-builder. Your support room is clulessnerds-support.

    Use the shared .proofdesk state directory under your working directory.

    Never invoke workflow.review or claim a fixture rehearsal was live.

    '
  machine: '{machine}'
- name: clulessnerds-builder
  description: Reproduces reports and prepares candidate commits
  provider: codex
  directory: '{directory}'
  addressing: owner-agents
  auto_mode: false
  auto_approve: false
  instructions: 'Read agents/builder.md and follow it as your workflow contract.

    Your Concierge is @clulessnerds-concierge and Verifier is @clulessnerds-verifier.

    Your rooms are clulessnerds-support and clulessnerds-engineering.

    Use the shared .proofdesk state directory under your working directory.

    '
  machine: '{machine}'
- name: clulessnerds-verifier
  description: Runs independent checks against exact candidate revisions
  provider: codex
  directory: '{directory}'
  addressing: owner-agents
  auto_mode: false
  auto_approve: false
  instructions: 'Read agents/verifier.md and follow it as your workflow contract.

    Your Builder is @clulessnerds-builder. Work in clulessnerds-engineering.

    Use the shared .proofdesk state directory under your working directory.

    Report executed evidence. Do not approve or edit candidate code.

    '
  machine: '{machine}'
group:
  name: ClulessNerds
  description: Customer report to independently checked local patch
rooms:
- name: clulessnerds-support
  description: Report intake, human review, and reply drafts
  channel_type: channel_private
  bridge: '{bridge}'
  agents:
  - clulessnerds-concierge
  - clulessnerds-builder
  users:
  - '{$creator}'
  instructions: 'Keep one thread per case. Post the case ID, state, evidence, and
    next actor.

    This is a synthetic hackathon demo. A closed case is not a deployment.

    Human review happens in the separate review CLI, not an agent message.

    '
  kickoff: '@clulessnerds-concierge introduce the intake flow; do not create a case
    yet.'
- name: clulessnerds-engineering
  description: Reproduction, candidate patches, and independent verification
  channel_type: channel_private
  bridge: '{bridge}'
  agents:
  - clulessnerds-builder
  - clulessnerds-verifier
  users:
  - '{$creator}'
  instructions: 'Tie every handoff to a case ID and full candidate commit.

    Report executed checks and evidence paths. Limit automatic repair attempts.

    Never grant human approval or change the trusted acceptance policy.

    '
links:
- from: clulessnerds-support
  to: clulessnerds-engineering
  label: engineering
- from: clulessnerds-engineering
  to: clulessnerds-support
  label: customer-context
